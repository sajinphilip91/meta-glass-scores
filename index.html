<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Matchday</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="app">

    <!-- Home -->
    <div id="screen-home" class="screen">
      <div class="screen-header home-header">
        <div class="icon-btn"></div>
        <div class="home-brand">
          <div class="home-logo">Matchday</div>
          <div class="home-tagline">The first live football &amp; cricket score app for Meta glasses</div>
        </div>
        <div class="icon-btn"></div>
      </div>
      <div class="home-toggle-bar">
        <div class="sport-toggle">
          <button class="toggle-opt focusable" id="btn-football" tabindex="0">Football</button>
          <button class="toggle-opt focusable" id="btn-cricket" tabindex="0">Cricket</button>
        </div>
      </div>
      <div id="home-content" class="screen-content"></div>
    </div>

    <!-- Match Detail -->
    <div id="screen-match-detail" class="screen">
      <div class="screen-header">
        <button class="icon-btn focusable" id="btn-back-detail" aria-label="Back">←</button>
        <div class="header-title" id="detail-competition-header"></div>
        <div class="icon-btn"></div>
      </div>
      <div id="match-detail-content" class="screen-content"></div>
    </div>



  </div>
  <script src="app.js"></script>
</body>
</html>
